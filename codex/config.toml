# Rollback option:
# model = "gpt-5.2-codex"
model = "gpt-5.4"
model_provider = "openai"
model_reasoning_effort = "xhigh"
web_search = "live"
personality = "pragmatic"
# Keep notify minimal in config.toml; execution details live in the runner script.
# The runner sources .botrc so non-interactive hooks use shared multi-machine env.
# Payload is forwarded as "$1" to the Python notification hook.
notify = [
  "/bin/bash",
  "-lc",
  "~/pro/botfiles/codex/hooks/run-codex-notify.sh \"$1\"",
  "codex-notify",
]
file_opener = "cursor"
profile = "azure"
history.persistence = "save-all" # Docs: https://developers.openai.com/codex/config-reference
# Leave history.max_bytes unset so Codex does not drop old entries via a configured byte cap.

[profiles.azure]
# Rollback options:
# model = "gpt-5.4"
# model = "gpt-5.3-codex"
# model = "gpt-5.2-codex"
model = "gpt-5.5"
model_provider = "azure"
model_reasoning_effort = "xhigh"
approvals_reviewer = "user"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[profiles.azure.features]
js_repl = false
guardian_approval = true
prevent_idle_sleep = false

[profiles.openai_api]
model = "gpt-5.4"
model_provider = "openai"
model_reasoning_effort = "xhigh"
forced_login_method = "api"
plan_mode_reasoning_effort = "xhigh"
approvals_reviewer = "guardian_subagent"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[profiles.openai_api.features]
js_repl = false
apps = false
guardian_approval = true
tui_app_server = false
prevent_idle_sleep = false

[profiles.chatgpt]
model = "gpt-5.4"
model_provider = "openai"
model_reasoning_effort = "xhigh"
forced_login_method = "chatgpt"
plan_mode_reasoning_effort = "xhigh"

[profiles.v0]
