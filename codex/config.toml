[notice]
"hide_gpt-5.1-codex-max_migration_prompt" = true

[notice.model_migrations]
"gpt-5.1-codex-max" = "gpt-5.2-codex"
"gpt-5.2-codex" = "gpt-5.3-codex"


[model_providers.azure]
name = "Azure OpenAI"
# Replace YOUR_RESOURCE_NAME with your Azure OpenAI resource name
# base_url = "https://YOUR_RESOURCE_NAME.openai.azure.com/openai/v1"
base_url = "https://ladduu-dev-openai.openai.azure.com/openai/v1"
# This points to the environment variable name you will set in the next step
env_key = "AZURE_OPENAI_API_KEY"
wire_api = "responses"

[model_providers.v0]
name = "v0"
base_url = "https://api.v0.dev/v1"
env_key = "V0_API_KEY"
wire_api = "responses"

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp?tools=web_search_exa,web_search_advanced_exa,get_code_context_exa,crawling_exa,company_research_exa,people_search_exa,deep_researcher_start,deep_researcher_check"

[features]
steer = true
shell_snapshot = true
collab = true
apps = true
multi_agent = true
