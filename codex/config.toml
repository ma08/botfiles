# Rollback option:
# model = "gpt-5.2-codex"
model_reasoning_effort = "xhigh"
web_search = "live"
personality = "pragmatic"
# Keep notify minimal in config.toml; execution details live in the runner script.
# The runner sources .botrc so non-interactive hooks use shared multi-machine env.
# Payload is forwarded as "$1" to the Python notification hook.
notify = [
  "/bin/bash",
  "-lc",
  "~/pro/botfiles/codex/hooks/run-codex-notify.sh \"$1\"",
  "codex-notify",
]
file_opener = "cursor"
# Profiles live in sibling `<name>.config.toml` files (chatgpt, azure,
# openai_api, v0) — codex-cli 0.134.0 dropped support for the legacy
# top-level `profile = "..."` selector and nested `[profiles.*]` tables.
# Activate one with `--profile <name>` (see ~/pro/botfiles/.botrc wrappers).
history.persistence = "save-all" # Docs: https://developers.openai.com/codex/config-reference
model = "gpt-5.5"
service_tier = "default"
# Leave history.max_bytes unset so Codex does not drop old entries via a configured byte cap.

[tui.keymap.global]
toggle_vim_mode = "alt-v"

