interface:
  display_name: "Start New Task"
  short_description: "Scaffold a tracked task workspace"
  default_prompt: "Create a new task folder with PST timestamp, status.md, immutable `user_inputs/initial.md`, `user_inputs/input_artifacts/`, `task-progress-artifacts/`, and `task-progress-artifacts/scratchpad/`. Keep the `user_inputs/` root for Markdown input notes, use `user_inputs/input_artifacts/` for files/images/reference captures, keep the top-level artifact folder curated for important deliverables/evidence, and use `scratchpad/` for raw/intermediate output files. Resolve tracker-aware slugging and use the canonical issue-owning repo task root when resolve_task_context reports one uniquely. Search that canonical root for an existing matching task before creating a new folder. Then upsert task metadata (machine/coding-agent/session/zellij/issue) and sync the linked issue live-session block when available. Do not stop after scaffolding: gather relevant tracker and local `context/` history, decide whether you have enough information to draft a first-pass plan, use `request_user_input` only for critical missing context, write the proposed plan into `status.md`, and present plan review options including approve, grill more, revise, and deny."
