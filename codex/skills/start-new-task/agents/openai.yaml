interface:
  display_name: "Start New Task"
  short_description: "Scaffold a tracked task workspace"
  default_prompt: "Create a new task folder with PST timestamp, status.md, immutable user_inputs/initial.md, and task-progress-artifacts. Resolve GitHub issue URLs for issue-aware slugging (`repo-issue-number-title`), then upsert task metadata (machine/coding-agent/session/zellij/issue) and sync the linked issue live-session block when available."
