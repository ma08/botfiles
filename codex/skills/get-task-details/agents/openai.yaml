interface:
  display_name: "Get Task Details"
  short_description: "Resolve status file, metadata, and a short task recap"
  default_prompt: "Find and print task details for the current task in this session. If recent conversation already includes an exact task folder path or status.md path, pass it directly with --task-dir or --status-file. Otherwise resolve the machine-local current-task pointer first, then fall back to the latest same-session task in the current project if needed. Print task folder, status path, the full GitHub issue URL, machine name, coding-agent name, agent session id, zellij session/link, and a three-bullet recap covering what the task is about, current status, and next steps. Keep the GitHub issue as the full clickable URL, not owner/repo#number shorthand. Only show related/stale entries when an explicit task-slug lookup is used."
