interface:
  display_name: "Get Task Details"
  short_description: "Resolve status file and task metadata"
  default_prompt: "Find and print task details for the current task in this session. If recent conversation already includes an exact task folder path or status.md path, pass it directly with --task-dir or --status-file. Otherwise resolve the machine-local current-task pointer first, then fall back to the latest same-session task in the current project if needed. Print status path, linked GitHub issue, machine name, coding-agent name, agent session id, and zellij session/link. Only show related/stale entries when an explicit task-slug lookup is used."
