<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>{{TITLE}}</title>
<style>
:root{--bg:#fff;--ink:#222;--muted:#777;--rule:#ddd;--link:#0645ad;--code:#f5f5f5;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;--mono:"SFMono-Regular",Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.62 var(--sans)}article{width:min(calc(100% - 36px),720px);margin:56px auto 80px}a{color:var(--link)}header{margin-bottom:42px}h1{font-size:2.25rem;line-height:1.08;letter-spacing:-.035em;margin:0 0 10px}h2{font-size:1.35rem;line-height:1.25;margin:48px 0 12px}h3{font-size:1rem;margin:28px 0 8px}.dek{font-size:1.08rem;color:#444}.meta{font-size:.78rem;color:var(--muted);margin-top:12px}p{margin:10px 0 17px}ul,ol{padding-left:23px}li{margin:5px 0}hr{border:0;border-top:1px solid var(--rule);margin:42px 0}blockquote{margin:24px 0;padding-left:18px;border-left:3px solid var(--rule);color:#555}code,pre{font-family:var(--mono)}code{font-size:.88em;background:var(--code);padding:.1em .28em}pre{background:var(--code);padding:14px 16px;overflow:auto;font-size:.8rem;line-height:1.5}.wide{width:min(920px,calc(100vw - 36px));margin-left:50%;transform:translateX(-50%)}figure{margin-top:28px;margin-bottom:30px}figure svg,figure img{display:block;max-width:100%;height:auto}figcaption{font-size:.78rem;color:var(--muted);margin-top:8px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:8px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}th{font-size:.78rem}.note{margin:22px 0;padding:14px 17px;background:#fafafa;border-left:3px solid #aaa}.sources{font-size:.82rem;color:#555}.sources li{word-break:break-word}
@media(max-width:560px){article{margin-top:32px}h1{font-size:1.85rem}.wide{width:100%;margin-left:0;transform:none}}
@media print{article{width:auto;margin:0}a{color:inherit;text-decoration:none}figure,.table-wrap,pre,.note{break-inside:avoid}}
</style>
</head>
<body><article>
<header><h1>{{TITLE}}</h1><div class="dek">{{DEK}}</div><div class="meta">{{DATE}} · {{STATUS}}</div></header>
{{BODY}}
<hr>
<section class="sources"><h2>Sources and validation</h2>{{SOURCES}}</section>
</article></body>
</html>
